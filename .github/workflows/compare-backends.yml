name: compare-backends

# Manual: judge the gold set (data/gold.jsonl) with one or more OpenAI-compatible
# models and refresh reports/bench.md. Already-answered (model, paper) pairs are skipped.
on:
  workflow_dispatch:
    inputs:
      models:
        description: "comma-separated model names (default FINDER_ESCALATE_MODEL / config)"
        required: false
      base_url:
        description: "OpenAI-compatible base URL (e.g. https://openrouter.ai/api/v1); uses secret COMPAT_API_KEY"
        required: false
      date:
        description: "replay every paper of this runDate (YYYY-MM-DD) instead of the gold set"
        required: false

permissions:
  contents: write

concurrency:
  group: daily-finder # shares data/ with the finder; never write it concurrently
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compare
        run: node src/cli.ts compare --model "${{ inputs.models || vars.FINDER_ESCALATE_MODEL || 'gpt-5' }}" ${{ inputs.date && format('--date {0}', inputs.date) }}
        env:
          OPENAI_API_KEY: ${{ inputs.base_url && secrets.COMPAT_API_KEY || secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ inputs.base_url }}
      - name: Commit decisions and benchmark
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet && exit 0
          git commit -m "compare: $(TZ=Asia/Seoul date +%F)"
          git push
